name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check Python files
        run: |
	  python -m py_compile E_fetch.py
	  python -m py_compile E_cleaning.py
	  python -m py_compile E_main.py
	  python -m py_compile E_visualization.py